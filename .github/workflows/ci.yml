name: CI

on:
  push:
    branches: [main, dev, 'agent/**']
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formato (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verificar formato
        run: cargo fmt --all -- --check

  clippy:
    name: Linter (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Ejecutar clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ejecutar tests
        run: cargo test --workspace --all-features

  docs:
    name: Diagramas y documento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar matplotlib
        run: pip install matplotlib
      - name: Validar diagramas (0 incidencias)
        run: python diagramas/brindis/fig_brindis.py
      - name: Instalar Tectonic
        uses: wtfjoke/setup-tectonic@v2
      - name: Compilar documento
        run: tectonic documentacion/brindis_rust.tex
        working-directory: documentacion
