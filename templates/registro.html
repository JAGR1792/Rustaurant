{% extends "base.html" %}
{# Registro publico: siempre rol cliente general con 0 strikes (RF02, Factory). #}
{% block titulo %}Registro — Brindis{% endblock %}
{% block contenido %}
<h1>Crear cuenta de cliente</h1>
{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="/registro">
  <label>Nombre <input type="text" name="nombre" required autocomplete="name"></label>
  <label>Correo <input type="email" name="correo" required autocomplete="email"></label>
  <label>Contraseña <input type="password" name="password" required autocomplete="new-password" minlength="8"></label>
  <button type="submit">Registrarme</button>
</form>
<p>¿Ya tienes cuenta? <a href="/login">Entrar</a></p>
{% endblock %}
